[workspace]
members = [
	"asset-registry",
	"auction",
	"authority",
	"benchmarking",
	"build-script-utils",
	"currencies",
	"gradually-update",
	"nft",
	"oracle",
	"oracle/runtime-api",
	"parameters",
	"payments",
	"rate-limit",
	"rewards",
	"tokens",
	"tokens/runtime-api",
	"traits",
	"unknown-tokens",
	"utilities",
	"vesting",
	"xcm-mock-message-queue",
	"xcm-support",
	"xcm",
	"xtokens",
]

resolver = "2"

[workspace.metadata.orml]
crates-version = "0.13.0"

[profile.dev]
split-debuginfo = "unpacked"

[workspace.dependencies]
log = { version = "0.4.20", default-features = false }
scale-info = { version = "2.10.0", default-features = false, features = ["derive"] }
serde = "1.0.189"
parity-scale-codec = { version = "3.6.5", default-features = false, features = ["max-encoded-len"] }

cumulus-pallet-xcm = { default-features = false , git="https://github.com/UniqueNetwork/polkadot-sdk", branch="v20241015" }
cumulus-primitives-core = { default-features = false , git="https://github.com/UniqueNetwork/polkadot-sdk", branch="v20241015" }
frame-benchmarking = { default-features = false , git="https://github.com/UniqueNetwork/polkadot-sdk", branch="v20241015" }
frame-support = { default-features = false , git="https://github.com/UniqueNetwork/polkadot-sdk", branch="v20241015" }
frame-system = { default-features = false , git="https://github.com/UniqueNetwork/polkadot-sdk", branch="v20241015" }
pallet-balances = { default-features = false , git="https://github.com/UniqueNetwork/polkadot-sdk", branch="v20241015" }
pallet-elections-phragmen = { default-features = false , git="https://github.com/UniqueNetwork/polkadot-sdk", branch="v20241015" }
pallet-message-queue = { default-features = false , git="https://github.com/UniqueNetwork/polkadot-sdk", branch="v20241015" }
pallet-preimage = { default-features = false , git="https://github.com/UniqueNetwork/polkadot-sdk", branch="v20241015" }
pallet-root-testing = { default-features = false , git="https://github.com/UniqueNetwork/polkadot-sdk", branch="v20241015" }
pallet-scheduler = { default-features = false , git="https://github.com/UniqueNetwork/polkadot-sdk", branch="v20241015" }
pallet-timestamp = { default-features = false , git="https://github.com/UniqueNetwork/polkadot-sdk", branch="v20241015" }
pallet-treasury = { default-features = false , git="https://github.com/UniqueNetwork/polkadot-sdk", branch="v20241015" }
pallet-xcm = { default-features = false , git="https://github.com/UniqueNetwork/polkadot-sdk", branch="v20241015" }
polkadot-parachain-primitives = { default-features = false , git="https://github.com/UniqueNetwork/polkadot-sdk", branch="v20241015" }
polkadot-runtime-common = { default-features = false , git="https://github.com/UniqueNetwork/polkadot-sdk", branch="v20241015" }
polkadot-runtime-parachains = { default-features = false , git="https://github.com/UniqueNetwork/polkadot-sdk", branch="v20241015" }
sp-api = { default-features = false , git="https://github.com/UniqueNetwork/polkadot-sdk", branch="v20241015" }
sp-application-crypto = { default-features = false , git="https://github.com/UniqueNetwork/polkadot-sdk", branch="v20241015" }
sp-arithmetic = { default-features = false , git="https://github.com/UniqueNetwork/polkadot-sdk", branch="v20241015" }
sp-core = { default-features = false , git="https://github.com/UniqueNetwork/polkadot-sdk", branch="v20241015" }
sp-io = { default-features = false , git="https://github.com/UniqueNetwork/polkadot-sdk", branch="v20241015" }
sp-runtime = { default-features = false , git="https://github.com/UniqueNetwork/polkadot-sdk", branch="v20241015" }
sp-runtime-interface = { default-features = false , git="https://github.com/UniqueNetwork/polkadot-sdk", branch="v20241015" }
sp-staking = { default-features = false , git="https://github.com/UniqueNetwork/polkadot-sdk", branch="v20241015" }
sp-std = { default-features = false , git="https://github.com/UniqueNetwork/polkadot-sdk", branch="v20241015" }
sp-storage = { default-features = false , git="https://github.com/UniqueNetwork/polkadot-sdk", branch="v20241015" }
xcm = { package = "staging-xcm", default-features = false , git="https://github.com/UniqueNetwork/polkadot-sdk", branch="v20241015" }
xcm-builder = { package = "staging-xcm-builder", default-features = false , git="https://github.com/UniqueNetwork/polkadot-sdk", branch="v20241015" }
xcm-executor = { package = "staging-xcm-executor", default-features = false , git="https://github.com/UniqueNetwork/polkadot-sdk", branch="v20241015" }

xcm-simulator = { git="https://github.com/UniqueNetwork/polkadot-sdk", branch="v20241015" }
